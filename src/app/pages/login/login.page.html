<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="login-container">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Welcome to Vault</ion-card-title>
        <ion-card-subtitle>Sign in to manage your inventory</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-button 
          expand="block" 
          size="large"
          (click)="handleLogin()"
          [disabled]="isLoading"
        >
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">Sign in with OAuth</span>
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
