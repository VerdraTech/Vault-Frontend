<div
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn modal-backdrop"
>
  <div
    class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-w-md w-full p-12 relative border border-slate-200 dark:border-slate-50/10 animate-slideUp"
  >
    <div
      *ngIf="title"
      class="text-2xl font-semibold text-slate-900 dark:text-slate-50 mb-6"
    >
      {{ title }}
    </div>

    <div
      (click)="onClose()"
      class="absolute top-4 right-4 text-slate-900 dark:text-slate-50 hover:text-slate-700 dark:hover:text-white transition-colors duration-200 cursor-pointer"
      aria-label="Close modal"
    >
      <img
        src="assets/close.svg"
        alt="Close"
        class="size-6 hover:rotate-90 transition-transform duration-200"
      />
    </div>

    <form [formGroup]="waitlistForm" (ngSubmit)="submitForm()">
      <div class="mb-4">
        <label
          for="name"
          class="block text-slate-900 dark:text-slate-50 text-sm font-bold mb-1"
        >
          Name
        </label>
        <input
          id="name"
          type="text"
          formControlName="name"
          class="w-full px-4 py-2 rounded-lg bg-white dark:bg-gray-800 text-slate-900 dark:text-white border border-slate-300 dark:border-gray-700 focus:border-blue-500 focus:outline-none"
          required
        />
        <div
          *ngIf="waitlistForm.get('name')?.invalid && waitlistForm.get('name')?.touched"
          class="text-red-500 dark:text-red-400 text-sm mt-1"
        >
          Name is required
        </div>
      </div>

      <div class="mb-6">
        <label
          for="email"
          class="block text-slate-900 dark:text-white text-sm font-bold mb-1"
        >
          Email
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="w-full px-4 py-2 rounded-lg bg-white dark:bg-gray-800 text-slate-900 dark:text-white border border-slate-300 dark:border-gray-700 focus:border-blue-500 focus:outline-none"
          required
        />
        <div
          *ngIf="waitlistForm.get('email')?.invalid && waitlistForm.get('email')?.touched"
          class="text-red-500 dark:text-red-400 text-sm mt-1"
        >
          Valid email is required
        </div>
      </div>

      <div
        class="w-full bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white font-semibold py-3 px-4 rounded-lg transition-colors duration-200 flex items-center justify-center cursor-pointer"
        (click)="submitForm()"
      >
        <span *ngIf="isSubmitting">Submitting...</span>
        <span *ngIf="!isSubmitting">Join Waitlist</span>
      </div>

      <div
        *ngIf="errorMessage"
        class="mt-4 text-red-600 dark:text-red-400 text-sm text-center"
      >
        {{ errorMessage }}
      </div>
      <div
        *ngIf="successMessage"
        class="mt-4 text-green-600 dark:text-green-400 text-sm text-center"
      >
        {{ successMessage }}
      </div>
    </form>
  </div>
</div>
