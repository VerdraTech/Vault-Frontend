<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ folder }}</ion-title>
    <ion-button slot="end" shape="round">
      <ion-icon slot="icon-only" name="exit-outline"></ion-icon>
    </ion-button>
    <ion-button slot="end" shape="round" (click)="navigateProfile()">
      <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{ folder }}</ion-title>
    </ion-toolbar>
  </ion-header>

  @if (folder === "inventory") {
    <app-inventory></app-inventory>
  }
  @if (folder === "marketplace") {
    <app-marketplace></app-marketplace>
  }
  @if (folder === "dashboard") {
    <app-dashboard></app-dashboard>
  }
  @if (folder === "dashboard") {
    <ion-content [fullscreen]="true">
      <app-dashboard></app-dashboard>
    </ion-content>
  }
  @if (folder === "sales") {
    <ion-content [fullscreen]="true">
      <app-sales></app-sales>
    </ion-content>
  }
  @if (folder === "shipping") {
    <ion-content [fullscreen]="true">
      <app-shipping></app-shipping>
    </ion-content>
  }
</ion-content>
